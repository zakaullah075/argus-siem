spring:
  application:
    name: argus

  datasource:
    url: jdbc:postgresql://localhost:5433/argus
    username: argus
    password: argus_local_dev

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the entities
      # match what the migrations produced.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

argus:
  jwt:
    # Local development value only. Production supplies ARGUS_JWT_SECRET from the
    # environment; anyone holding this secret can mint tokens for any tenant.
    secret: ${ARGUS_JWT_SECRET:local-dev-secret-not-for-production-use-min-32-bytes}
    ttl-seconds: ${ARGUS_JWT_TTL_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
