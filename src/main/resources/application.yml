spring:
  application:
    name: argus

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/argus}
    username: ${SPRING_DATASOURCE_USERNAME:argus}
    password: ${SPRING_DATASOURCE_PASSWORD:argus_local_dev}
    hikari:
      # Neon's free tier caps connections, and the container has 512MB. Ten idle
      # connections would waste both. Small pool, short idle timeout.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: 30000
      connection-timeout: 20000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:argus}
    password: ${SPRING_RABBITMQ_PASSWORD:argus_local_dev}
    # Hosted brokers put each account on its own vhost and require TLS. Both
    # default to the local values so nothing changes for development.
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:false}
    connection-timeout: 20000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          multiplier: 2
        # After the retries are exhausted the message is rejected without
        # requeue, which routes it to the dead letter queue. Requeueing instead
        # would spin the same poison message forever.
        default-requeue-rejected: false

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the entities
      # match what the migrations produced.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

argus:
  jwt:
    # Local development value only. Production supplies ARGUS_JWT_SECRET from the
    # environment; anyone holding this secret can mint tokens for any tenant.
    secret: ${ARGUS_JWT_SECRET:local-dev-secret-not-for-production-use-min-32-bytes}
    ttl-seconds: ${ARGUS_JWT_TTL_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: argus
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
