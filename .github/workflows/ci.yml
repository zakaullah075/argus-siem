name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run rather than paying for a build nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        # Testcontainers starts real Postgres and RabbitMQ against the runner's
        # Docker daemon, so no service containers are declared here.
        run: mvn -B verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  security:
    name: Security scan
    runs-on: ubuntu-latest

    # Findings should not silently pass because the build broke earlier.
    needs: build

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than @master. An unpinned action changes underneath you,
      # so a build that passed yesterday fails today for reasons unrelated to
      # your code — and in a security tool, it is also a supply chain risk.
      - name: Scan dependencies and source
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Reporting runs to completion; the explicit gate below decides whether
          # the build fails. Mixing the two makes a scan error look like a finding.
          exit-code: '0'

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        # Tolerated: code scanning is not available on every plan, and losing the
        # dashboard should not fail a build that has already reported its findings.
        continue-on-error: true
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on critical findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: table
          # Only CRITICAL blocks. A gate that fires on everything gets routinely
          # overridden, which is worse than no gate.
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t argus:${{ github.sha }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: argus:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
