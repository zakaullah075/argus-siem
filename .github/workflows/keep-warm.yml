name: Keep warm

# Render's free tier stops a service after 15 minutes of inactivity, and a cold
# JVM takes the better part of a minute to answer. Anyone opening the demo link
# in that window sees a dead page. A cheap ping keeps the instance alive.
#
# This exists because the deployment is on a free tier. On a paid instance it
# should be deleted rather than left running.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.ARGUS_URL }}" ]; then
            echo "ARGUS_URL repository variable is not set; nothing to ping."
            exit 0
          fi
          # Never fail the workflow on a bad ping. A red cross here would mean
          # "the demo was asleep", which is not a build failure and would train
          # everyone to ignore the badge.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            "${{ vars.ARGUS_URL }}/actuator/health" || echo "000")
          echo "health check returned $code"
